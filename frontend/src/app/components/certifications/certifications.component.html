<section id="certifications" class="certifications-section section-padding">
  <div class="container-xl">
    
    <!-- Section Header -->
    <div class="text-center mb-5">
      <div class="section-tag">
        <i class="bi bi-award-fill"></i>
        <span>Verified Credentials</span>
      </div>
      <h2 class="section-title">
        Certifications &amp; <span class="gradient-text">Training</span>
      </h2>
      <p class="section-subtitle">
        Validated proficiencies in modern web frameworks, database engineering, and application development.
      </p>
    </div>

    <!-- Certificate Cards -->
    <div class="row g-4 justify-content-center">
      <div class="col-lg-4 col-md-6" *ngFor="let cert of certifications">
        <div class="cert-card glass-card card-3d p-4 p-xl-5 h-100 d-flex flex-column justify-content-between">
          
          <div>
            <!-- Category and Icon -->
            <div class="d-flex align-items-center justify-content-between mb-4">
              <span class="cert-category-badge font-mono-code" [style.color]="cert.accentColor" [style.border-color]="cert.accentColor + '44'">
                {{ cert.category }}
              </span>
              <div class="cert-icon-circle" [style.background]="cert.accentColor + '15'" [style.border-color]="cert.accentColor + '33'">
                <i class="bi {{ cert.icon }}" [style.color]="cert.accentColor"></i>
              </div>
            </div>

            <!-- Title & Issuer -->
            <h4 class="cert-title text-white mb-2">{{ cert.title }}</h4>
            <div class="cert-issuer text-cyan mb-3 font-mono-code text-sm">
              <i class="bi bi-shield-check me-1"></i> {{ cert.issuer }}
            </div>

            <!-- Description -->
            <p class="cert-desc text-muted text-sm mb-0">
              {{ cert.description }}
            </p>
          </div>

          <!-- Verified Badge -->
          <div class="pt-3 mt-4 border-top border-secondary border-opacity-25 d-flex align-items-center justify-content-between">
            <span class="verified-pill text-xs d-flex align-items-center gap-1 text-light">
              <i class="bi bi-patch-check-fill text-success"></i> Credential Verified
            </span>
            <span class="text-xs font-mono-code text-dim">Pune, MH</span>
          </div>

        </div>
      </div>
    </div>

  </div>
</section>
